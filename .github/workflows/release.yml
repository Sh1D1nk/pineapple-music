name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to attach the build to (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npx electron-builder --win nsis -c.directories.output=dist-ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: dist-ci/*.exe
          fail_on_unmatched_files: true
